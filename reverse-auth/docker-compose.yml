services:
  auth-gateway:
    build: .
    container_name: firecrawl-auth-gateway
    restart: unless-stopped
    environment:
      # URL do Firecrawl (ajuste conforme seu setup)
      - PROXY_URL=http://google.com.br
      # Porta de escuta
      - LISTEN_PORT=80
      # Token de administração (opcional, mas recomendado)
      # Gere com: openssl rand -base64 32
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      # Habilitar logs de debug (true/false)
      - DEBUG=${DEBUG:-false}
    ports:
      - "8080:80"
    volumes:
      # Persiste os tokens mesmo após reinicialização
      - auth_tokens:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Se Firecrawl estiver em outro container, adicione:
    # depends_on:
    #   - firecrawl

volumes:
  auth_tokens:
    driver: local
